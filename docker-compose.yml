services:
  web:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./src:/app/src
      - ./public:/app/public
      - ./bin:/app/bin
      - ./tests:/app/tests
      - ./composer.json:/app/composer.json
      - ./composer.lock:/app/composer.lock
      - ./vendor:/app/vendor
      - order-data:/app/data

volumes:
  order-data:
